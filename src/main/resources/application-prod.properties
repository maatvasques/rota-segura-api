# Profile "prod": usar SOMENTE no deploy se o Render não conseguir
# conectar no Oracle da FIAP (timeout). Usa H2 em memória.
# Para ativar: variável de ambiente SPRING_PROFILES_ACTIVE=prod
spring.datasource.url=jdbc:h2:mem:rotasegura;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
