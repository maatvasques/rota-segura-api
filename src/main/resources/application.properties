spring.application.name=rota-segura-api

# Lê o arquivo .env da raiz do projeto (se existir). Útil para rodar local.
spring.config.import=optional:file:.env[.properties]

# Porta: o Render informa pela variável PORT
server.port=${PORT:8080}

# Banco Oracle da FIAP - valores vêm das variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
